name: Pages

# Checks the site on every pull request.
# Publishes the repo root to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the site files
        run: |
          if [ ! -f index.html ]; then
            echo "::error file=index.html::No index.html at the repo root yet, so there is nothing to publish."
            exit 1
          fi
          # GitHub Pages serves this repo from /<repo-name>/, so links that
          # start with "/" (like href="/style.css") break on the live site.
          bad=$(grep -nE '(href|src)="/[^/]' --include='*.html' -r . || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Use relative paths (style.css, not /style.css). The live site is served from /${GITHUB_REPOSITORY#*/}/."
            exit 1
          fi
          echo "Found index.html and no root-relative links."

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the repo root
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
